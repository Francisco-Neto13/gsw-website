name: Deploy

# O que está na main vai para a produção na VPS (docs/MIGRACAO-VPS.md, docs/CI-CD.md). A CI inicia este workflow
# logo depois de promover a develop para a main (ci.yml), então a main só tem commits que passaram na CI. Também
# roda à mão: dry_run mostra o que entraria, sem mudar nada; voltar põe no ar a versão anterior.
#
# Modelo do Portfolio: a chave da CI só consegue chamar "deploy" no servidor (comando forçado do usuário
# deploy-gsw, infra/servidor/configurar-deploy.sh). O build roda na VPS, dentro do docker build.
#
# DESABILITADO até ser validado: o deploy de verdade só roda com a variável de repositório
# DEPLOY_HABILITADO = true. O dry_run funciona sempre.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "deploy, dry_run (simular) ou voltar (versão anterior)"
        type: choice
        options: [deploy, dry_run, voltar]
        default: deploy

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy para a produção
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      MODO: ${{ inputs.modo || 'deploy' }}
      DEPLOY_HABILITADO: ${{ vars.DEPLOY_HABILITADO }}
    steps:
      - name: Conferir se o deploy está habilitado
        run: |
          if [ "$MODO" != "dry_run" ] && [ "$DEPLOY_HABILITADO" != "true" ]; then
            echo "::error::Deploy desabilitado. Rode com dry_run ou defina a variável DEPLOY_HABILITADO = true."
            exit 1
          fi

      - name: Conferir os secrets
        run: |
          faltam=()
          for nome in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!nome}" ] || faltam+=("$nome")
          done
          if [ "${#faltam[@]}" -gt 0 ]; then
            echo "::error::Secrets ausentes: ${faltam[*]}. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configurar o SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          case "$MODO" in
            dry_run) comando="deploy --dry-run" ;;
            voltar) comando="deploy --voltar" ;;
            *) comando="deploy" ;;
          esac
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$comando"
