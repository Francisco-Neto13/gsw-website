name: Deploy

# O que está na main vai para a produção na Vercel. A CI inicia este workflow logo depois de
# promover a develop para a main (ci.yml), então a main só tem commits que passaram na CI. Também
# roda à mão, com dry_run para validar token e projeto sem publicar nada.
#
# DESABILITADO até ser validado: o deploy de verdade só roda com a variável de repositório
# DEPLOY_HABILITADO = true. O dry_run funciona sempre (docs/CI-CD.md, "Ativar o deploy").
#
# A integração Git da Vercel está desligada: este workflow é o único caminho para a produção.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Baixar a configuração e montar o build sem publicar"
        type: boolean
        default: false

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy para a produção
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      DEPLOY_HABILITADO: ${{ vars.DEPLOY_HABILITADO }}
    steps:
      - name: Conferir se o deploy está habilitado
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$DEPLOY_HABILITADO" != "true" ]; then
            echo "::error::Deploy desabilitado. Rode com dry_run ou defina a variável DEPLOY_HABILITADO = true (docs/CI-CD.md)."
            exit 1
          fi

      - name: Validar os secrets do deploy
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]}. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # CLI fixada: atualizar de propósito, num PR próprio. O token vai pela env VERCEL_TOKEN,
      # nunca na linha de comando (apareceria no log de processos).
      - name: Baixar a configuração do projeto
        run: npx --yes vercel@65.9.0 pull --yes --environment=production
      - name: Build
        run: npx --yes vercel@65.9.0 build --prod
      - name: Publicar
        if: env.DRY_RUN != 'true'
        run: npx --yes vercel@65.9.0 deploy --prebuilt --prod
      - name: Resumo do dry run
        if: env.DRY_RUN == 'true'
        run: echo "dry_run - configuração baixada e build montado. Nada foi publicado."
