name: CI

# Fluxo de branches (docs/CI-CD.md):
#
#   <tipo>/<assunto>  --PR + CI verde-->  develop  --CI verde-->  main  -->  deploy (desligado)
#
# 1. O trabalho nasce da develop numa branch própria (feat/, fix/, docs/, chore/...) e volta por PR.
#    Quando as verificações do PR passam, o job "Mesclar na develop" mescla e apaga a branch.
# 2. A develop mesclada roda esta CI de novo, sobre o commit que ela tem de fato. Verde, o job
#    "Promover para a main" avança a main até esse commit e, se o deploy estiver habilitado
#    (variável DEPLOY_HABILITADO = true), dispara o workflow Deploy.
#
# POR QUE O WORKFLOW MESCLA: a trava de develop e main é este workflow mais o hook
# .githooks/pre-push, sem depender de configuração do repositório no GitHub.
#
# POR QUE A CI RODA DE NOVO NA DEVELOP: o PR testa o merge com a develop do momento em que foi
# aberto. Se outro PR entrou no meio, o commit que chega à develop nunca foi testado.
#
# POR QUE workflow_dispatch: um push feito com o token do Actions não dispara outro workflow
# (proteção do GitHub contra loops), mas um dispatch pela API dispara. O mesmo vale para o deploy.
on:
  pull_request:
    branches: [develop, main]
    # ready_for_review: um rascunho marcado como pronto roda a CI de novo e, verde, é mesclado
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Um push novo cancela a execução anterior da mesma branch. A develop não cancela: uma execução
# dela pode estar no meio da promoção, e cortar ali deixaria a main para trás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  origem:
    name: Branch de origem
    runs-on: ubuntu-latest
    steps:
      # A develop recebe trabalho; a main só recebe a develop. Os nomes das branches entram por
      # env, nunca interpolados no script: são texto escrito por quem abre o PR.
      - name: Conferir branch de origem
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "evento $EVENTO: sem regra de origem"
            exit 0
          fi
          case "$BASE" in
            main)
              if [ "$ORIGEM" != "develop" ]; then
                echo "::error::PR para a main só vem da develop (veio de '$ORIGEM')."
                exit 1
              fi ;;
            develop)
              case "$ORIGEM" in
                main|develop)
                  echo "::error::PR para a develop vem de uma branch de trabalho, não de '$ORIGEM'."
                  exit 1 ;;
              esac ;;
          esac
          echo "ok: $ORIGEM -> $BASE"

  front:
    name: "Tipos, lint, testes e build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  seguranca:
    name: Segredos no histórico
    runs-on: ubuntu-latest
    steps:
      # Histórico inteiro: um segredo apagado num commit seguinte continua no git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks pela imagem oficial. Segredo novo de verdade se rotaciona, não se ignora.
      - name: Segredos no histórico (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner --exit-code 1

  # ------------------------------------------------------------------ o fluxo

  mesclar:
    name: Mesclar na develop
    runs-on: ubuntu-latest
    needs: [origem, front, seguranca]
    # Só PR para a develop, aberto de dentro do repositório (de um fork o token não escreve) e
    # fora de rascunho: o rascunho é o jeito de ver a CI sem pedir o merge.
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Merge commit, não squash: os commits da branch já seguem docs/PADROES.md.
      # --match-head-commit: só entra o commit que estas verificações testaram.
      - name: Mesclar o PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TESTADO: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$REPO" --merge --delete-branch --match-head-commit "$TESTADO"

      # O merge feito pelo token do Actions não inicia a CI da develop sozinho
      - name: Rodar a CI na develop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --repo "$REPO" --ref develop

  promover:
    name: Promover para a main
    runs-on: ubuntu-latest
    needs: [front, seguranca]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SÓ AVANÇA, NUNCA REESCREVE. A main recebe exatamente o commit que esta execução testou, e
      # só se for um avanço dela. Se a main tiver um commit que a develop não tem, o job falha:
      # alguém precisa olhar, o workflow não escolhe lado.
      - name: Promover para a main
        id: promover
        env:
          TESTADO: ${{ github.sha }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$TESTADO" origin/main; then
            echo "A main já contém $TESTADO. Nada a promover."
            echo "promovido=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$TESTADO"; then
            echo "::error::A main tem commits que a develop não tem. Traga a main para a develop por PR e a promoção volta a andar."
            exit 1
          fi
          git push origin "$TESTADO:refs/heads/main"
          echo "main promovida para $TESTADO"
          echo "promovido=true" >> "$GITHUB_OUTPUT"

      # Deploy desligado até ser validado (docs/CI-CD.md, "Ativar o deploy").
      - name: Deploy desabilitado
        if: steps.promover.outputs.promovido == 'true' && vars.DEPLOY_HABILITADO != 'true'
        run: echo "::notice::main promovida. O deploy automático está desabilitado (DEPLOY_HABILITADO != true); nada foi publicado."

      # Logo depois de um push que muda os workflows, o GitHub pode responder 404 por alguns
      # segundos: daí as tentativas.
      - name: Disparar o deploy
        if: steps.promover.outputs.promovido == 'true' && vars.DEPLOY_HABILITADO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tentativa in 1 2 3 4 5 6; do
            if gh workflow run deploy.yml --repo "$REPO" --ref main; then
              exit 0
            fi
            echo "Tentativa $tentativa falhou; de novo em 10 s."
            sleep 10
          done
          echo "::error::Não consegui disparar o deploy. Rode o workflow Deploy à mão na main."
          exit 1
