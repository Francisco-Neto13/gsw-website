# Produção na VPS (docs/MIGRACAO-VPS.md). O proxy da VPS alcança o site como gsw-prod-web-1:8080 pela rede
# "borda" (arquivo de site em infra/proxy/gsw.caddy). Nunca publicar porta aqui: o Docker ignora o ufw.
#   docker compose -f infra/docker-compose.prod.yml up -d --build --wait
name: gsw-prod

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: gsw-web:latest
    restart: unless-stopped
    # Tetos do padrão da VPS (/srv/REGRAS-DA-VPS.md): o Caddy servindo arquivos usa ~15 MB.
    # 0,25 CPU deixava o servidor estático do Muda pausado pelo teto; 0,5 dá folga sem pesar nos outros.
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 256
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # O Caddy guarda estado em /config e /data mesmo sem HTTPS; tmpfs conta na memória, por isso o tamanho
    tmpfs:
      - /config:uid=1000,gid=1000,size=1m
      - /data:uid=1000,gid=1000,size=1m
      - /tmp:size=1m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - borda

networks:
  borda:
    external: true
